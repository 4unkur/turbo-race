<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c8cff">
<title>Турбо Гонка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@800;900&display=swap">
<style>
/* Layout: full-bleed canvas world; chunky comic-outlined HUD chips pinned to safe-area corners; big pedals in the bottom corners */
:root{
  --ink:#1b1f3b;
  --paper:#fffaf0;
  --sky:#1c8cff;
  --gas:#2ee05a; --gas-d:#14963a;
  --brake:#ff3b4e; --brake-d:#b81d2e;
  --nitro:#8b3dff; --nitro-hi:#00e5ff;
  --gold:#ffd23f; --hot:#ff2b4a;
  --display:'Russo One','Arial Black',Impact,system-ui,sans-serif;
  --body:'Nunito','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --gasW:clamp(100px,22vmin,150px); --gasH:clamp(130px,32vmin,200px);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);
  font-family:var(--body);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--gold);outline-offset:4px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:calc(var(--st) + 10px);left:calc(var(--sl) + 12px);right:calc(var(--sr) + 12px);
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.chip{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.place{font-family:var(--display);font-size:clamp(30px,8vmin,52px);line-height:1;padding:6px 14px 8px;text-align:center;min-width:76px}
.place small{font-size:.48em}
.place .lbl{display:block;font-family:var(--body);font-weight:900;font-size:11px;letter-spacing:.12em;margin-top:2px}
.place.g1{background:var(--gold)} .place.g2{background:#dfe7f2} .place.g3{background:#ffb37a}
.mid{flex:1;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:4px;min-width:0}
.bar{position:relative;width:100%;height:20px;border-radius:12px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.bar .flag{position:absolute;right:-6px;top:50%;width:26px;height:26px;transform:translateY(-50%);border:3px solid var(--ink);border-radius:6px;
  background:conic-gradient(#111 25%,#fff 0 50%,#111 0 75%,#fff 0) 0 0/10px 10px}
.dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);transform:translate(-50%,-50%)}
.dot.me{width:24px;height:24px;background:var(--hot);border-width:3px;z-index:2}
.speed{font-family:var(--display);color:#fff;font-size:clamp(18px,4.6vmin,30px);line-height:1;
  text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 3px 0 var(--ink);font-variant-numeric:tabular-nums}
.speed small{font-size:.55em}
#wheel{width:clamp(34px,8vmin,48px);height:auto;filter:drop-shadow(0 3px 0 var(--ink))}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.stars{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:clamp(22px,6vmin,36px);padding:4px 12px 6px 8px;line-height:1}
.stars svg{width:1.1em;height:1.1em}
#mute{pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
#mute svg{width:24px;height:24px}

.pedal{position:absolute;pointer-events:auto;bottom:calc(var(--sb) + 18px);border:4px solid var(--ink);border-radius:30px;
  font-family:var(--display);color:#fff;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 9px 0 var(--ink);transition:transform .05s,box-shadow .05s}
.pedal svg{width:46%;height:auto}
.pedal.down{transform:translateY(7px);box-shadow:0 2px 0 var(--ink);filter:brightness(1.12)}
#gas{right:calc(var(--sr) + 16px);width:var(--gasW);height:var(--gasH);font-size:clamp(18px,4.6vmin,26px);
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 10px,transparent 10px 22px),linear-gradient(var(--gas),var(--gas-d))}
#brake{left:calc(var(--sl) + 16px);width:clamp(96px,21vmin,140px);height:clamp(96px,21vmin,140px);font-size:clamp(14px,3.6vmin,20px);
  background:linear-gradient(var(--brake),var(--brake-d))}
#nitro{position:absolute;pointer-events:auto;right:calc(var(--sr) + 16px + var(--gasW) + 18px);bottom:calc(var(--sb) + 26px);
  width:clamp(88px,20vmin,128px);aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);
  background:radial-gradient(circle at 35% 30%,#bff8ff 0,var(--nitro-hi) 22%,var(--nitro) 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);color:#fff;
  font-size:clamp(13px,3.2vmin,18px);text-shadow:0 2px 0 var(--ink);animation:pop .45s cubic-bezier(.3,1.6,.5,1),pulse 1s .45s infinite}
#nitro svg{width:48%;height:auto}
#nitro .ring{position:absolute;inset:-12px;border-radius:50%;border:4px solid var(--nitro-hi);animation:ring 1s infinite;pointer-events:none}
@media (orientation:portrait){
  #nitro{right:calc(var(--sr) + 16px + (var(--gasW) - clamp(88px,20vmin,128px))/2);bottom:calc(var(--sb) + 18px + var(--gasH) + 28px)}
}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}

#count{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--display);font-size:clamp(80px,26vmin,200px);
  line-height:1;color:var(--gold);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink)}
#count.go{color:var(--gas);font-size:clamp(56px,15vmin,130px)}
#count.anim{animation:countPop .9s ease-out both}
@keyframes countPop{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.8);opacity:0}}
#toast{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:var(--display);font-size:clamp(34px,10vmin,72px);
  color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);opacity:0}
#toast.anim{animation:toastPop 1.3s ease-out both}
@keyframes toastPop{0%{transform:scale(.3) rotate(-8deg);opacity:0}15%{transform:scale(1.15) rotate(3deg);opacity:1}25%{transform:scale(1) rotate(0)}75%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
#hint{position:absolute;left:50%;top:44%;transform:translateX(-50%);max-width:min(90vw,460px);text-align:center;
  font-weight:900;font-size:clamp(16px,4vmin,22px);padding:10px 18px}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,3vmin,22px);
  padding:calc(var(--st) + 16px) calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px);text-align:center;
  background:radial-gradient(ellipse at center,rgba(27,31,59,.15),rgba(27,31,59,.55))}
h1{margin:0;font-family:var(--display);font-weight:400;line-height:.95;font-size:clamp(54px,16vmin,130px);letter-spacing:.02em;
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 9px 0 var(--ink);transform:rotate(-4deg)}
h1 .a{color:var(--gold);display:block} h1 .b{color:var(--hot);display:block;margin-left:.6em}
.big{font-family:var(--display);font-size:clamp(28px,8vmin,52px);padding:.35em 1.1em .45em;border-radius:24px;border:4px solid var(--ink);
  background:linear-gradient(var(--gas),var(--gas-d));color:#fff;text-shadow:0 3px 0 var(--ink);box-shadow:0 9px 0 var(--ink);
  animation:pulse 1.2s infinite;touch-action:manipulation}
.big:active{transform:translateY(6px);box-shadow:0 3px 0 var(--ink);animation:none}
.tip{display:flex;align-items:center;gap:12px;padding:10px 16px;font-weight:900;font-size:clamp(14px,3.6vmin,20px);max-width:520px;text-align:left}
.tip svg{flex:none;width:58px;height:40px;animation:tilt 2.4s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
.keys{font-weight:800;font-size:13px;color:#fff;text-shadow:0 2px 0 var(--ink);max-width:520px}

.card{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vmin,14px);padding:clamp(16px,4vmin,28px) clamp(22px,6vmin,44px);
  background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink);animation:pop .5s cubic-bezier(.3,1.6,.5,1);max-width:100%}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,11vmin,80px);line-height:1;color:var(--gold);
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.medal{width:clamp(90px,24vmin,150px);aspect-ratio:1;border-radius:50%;border:5px solid var(--ink);display:grid;place-items:center;
  font-family:var(--display);font-size:clamp(46px,13vmin,84px);color:var(--ink);box-shadow:0 6px 0 var(--ink),inset 0 -10px 0 rgba(0,0,0,.12);
  background:radial-gradient(circle at 35% 30%,#fff7c2,var(--gold) 55%,#e0a800)}
.medal.m2{background:radial-gradient(circle at 35% 30%,#fff,#d5dde8 55%,#9aa7b8)}
.medal.m3{background:radial-gradient(circle at 35% 30%,#ffe0c4,#ff9f5a 55%,#c96a26)}
.medal.m4{background:radial-gradient(circle at 35% 30%,#d6f4ff,#58c6ff 55%,#2a86d6)}
.sub{font-weight:900;font-size:clamp(18px,4.6vmin,28px);margin:0}
.got{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:clamp(22px,6vmin,36px)}
.got svg{width:1.2em;height:1.2em}

.diff{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.diff button{--c:var(--gas-d);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:clamp(92px,22vmin,130px);
  font-family:var(--display);font-size:clamp(14px,3.6vmin,20px);line-height:1;padding:8px 12px 9px;border:3px solid var(--ink);border-radius:16px;
  background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--ink);touch-action:manipulation;transition:transform .08s,box-shadow .08s}
.diff button .lv{font-size:1.05em;letter-spacing:.08em;color:var(--c)}
.diff button[data-d="medium"]{--c:#ff9f1c} .diff button[data-d="hard"]{--c:var(--brake)}
.diff button[aria-pressed="true"]{background:var(--c);color:#fff;text-shadow:0 2px 0 var(--ink);transform:translateY(3px) scale(1.06);box-shadow:0 2px 0 var(--ink)}
.diff button[aria-pressed="true"] .lv{color:var(--gold)}
@media (max-height:440px){
  h1{font-size:46px;-webkit-text-stroke-width:5px;text-shadow:0 6px 0 var(--ink)}
  #menu{gap:10px}
  .big{font-size:26px}
  .tip{padding:6px 12px;font-size:13px}
  .tip svg{width:44px;height:30px}
  .diff button{min-width:84px;font-size:13px;padding:6px 10px 7px}
  .card .diff{gap:6px}
}
@media (max-height:440px){
  .card{gap:6px;padding:12px 28px 16px}
  .card h2{font-size:38px}
  .medal{width:68px;font-size:40px}
  .sub{font-size:17px}
  .got{font-size:22px}
  .card .big{font-size:24px}
}
@media (prefers-reduced-motion:reduce){
  .big,#nitro,#nitro .ring,.tip svg{animation:none}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="top">
    <div class="chip place" id="place"><span id="placeNum">6</span><small>/6</small><span class="lbl">МЕСТО</span></div>
    <div class="mid">
      <div class="bar" id="bar"><div class="flag"></div></div>
      <div class="speed"><span id="speed">0</span> <small>км/ч</small></div>
      <svg id="wheel" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="40" fill="none" stroke="#1b1f3b" stroke-width="18"/>
        <circle cx="50" cy="50" r="40" fill="none" stroke="#ff2b4a" stroke-width="10"/>
        <path d="M14 50h72M50 50v38" stroke="#1b1f3b" stroke-width="14" stroke-linecap="round"/>
        <path d="M14 50h72M50 50v38" stroke="#fffaf0" stroke-width="7" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="12" fill="#ffd23f" stroke="#1b1f3b" stroke-width="5"/>
        <rect x="45" y="6" width="10" height="12" rx="3" fill="#ffd23f" stroke="#1b1f3b" stroke-width="3"/>
      </svg>
    </div>
    <div class="right">
      <div class="chip stars"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.3 3.6 1.5-7.1L1.8 9.2 9 8.4z" fill="#ffd23f" stroke="#1b1f3b" stroke-width="2" stroke-linejoin="round"/></svg><span id="stars">0</span></div>
      <button id="mute" aria-label="Звук вкл/выкл"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="muteIcon" d="M4 9h4l5-4v14l-5-4H4z M16 8.5c1.5 1.8 1.5 5.2 0 7 M18.5 6c3 3 3 9 0 12" fill="none" stroke="#1b1f3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>

  <div id="count"></div>
  <div id="toast"></div>
  <div id="hint" class="chip" hidden>Рули пальцем: держи палец слева или справа на экране</div>

  <button id="brake" class="pedal" aria-label="Тормоз">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="6" y="6" width="28" height="28" rx="6" fill="#fff" stroke="#1b1f3b" stroke-width="3"/><rect x="15" y="13" width="10" height="14" rx="2" fill="#1b1f3b"/></svg>
    ТОРМОЗ
  </button>
  <button id="nitro" aria-label="Азот" hidden>
    <span class="ring"></span>
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M23 3L8 23h10l-3 14 16-21H21z" fill="#ffd23f" stroke="#1b1f3b" stroke-width="3" stroke-linejoin="round"/></svg>
    АЗОТ
  </button>
  <button id="gas" class="pedal" aria-label="Газ">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5L35 22H26V35H14V22H5z" fill="#fff" stroke="#1b1f3b" stroke-width="3" stroke-linejoin="round"/></svg>
    ГАЗ
  </button>
</div>

<div id="menu" class="screen">
  <h1><span class="a">ТУРБО</span><span class="b">ГОНКА</span></h1>
  <div class="diff" id="diffMenu" role="group" aria-label="Сложность"></div>
  <button id="startBtn" class="big">ПОЕХАЛИ!</button>
  <div class="chip tip">
    <svg viewBox="0 0 58 40" aria-hidden="true"><rect x="3" y="5" width="52" height="30" rx="7" fill="#fff" stroke="#1b1f3b" stroke-width="3.5"/><rect x="10" y="11" width="38" height="18" rx="3" fill="#58c6ff"/><circle cx="29" cy="20" r="4" fill="#ff2b4a"/></svg>
    <span>Держи телефон как руль и наклоняй влево‑вправо. Жми ГАЗ и собирай звёзды!</span>
  </div>
  <div class="keys" id="keysTip" hidden>На компьютере: ← → руль, ↑ газ, ↓ тормоз, пробел — азот</div>
</div>

<div id="finish" class="screen" hidden>
  <div class="card">
    <h2 id="finTitle">ПОБЕДА!</h2>
    <div class="medal" id="medal">1</div>
    <p class="sub" id="finSub">Ты приехал первым!</p>
    <div class="got"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.3 3.6 1.5-7.1L1.8 9.2 9 8.4z" fill="#ffd23f" stroke="#1b1f3b" stroke-width="2" stroke-linejoin="round"/></svg><span id="finStars">0</span></div>
    <div class="diff" id="diffFin" role="group" aria-label="Сложность"></div>
    <button id="againBtn" class="big">ЕЩЁ РАЗ!</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ================= helpers =================
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const pctRem = (n, total) => (n % total) / total;
const wrap = (v, max) => { v %= max; return v < 0 ? v + max : v; };
const overlap = (x1, w1, x2, w2, k = 1) => Math.abs(x1 - x2) < (w1 + w2) * k / 2;
const easeIn = (a, b, p) => a + (b - a) * p * p;
const easeInOut = (a, b, p) => a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5);
const hexRgb = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); };
const rgbStr = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const mixRgb = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p), lerp(a[2], b[2], p)];
const shade = (hex, k) => rgbStr(hexRgb(hex).map(v => k < 0 ? v * (1 + k) : v + (255 - v) * k));
const INK = '#1b1f3b';

// ================= canvas =================
const cvs = $('game');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.75);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ================= world constants =================
const SEG = 200, RUMBLE = 3, ROAD_W = 2000, LANES = 3, FOV = 100, CAM_H = 1000, DRAW = 200;
const CAM_D = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const PLAYER_Z = CAM_H * CAM_D;
const MAX = SEG * 60;               // top speed, world units / s
const NITRO_MAX = MAX * 1.45;
const ACCEL = MAX / 3.5, BRAKE = -MAX / 1.4, DECEL = -MAX / 7;
// difficulty: opponent pace, catch-up rules, how hard the road pushes back
const DIFFS = {
  easy:   { name: 'ЛЁГКИЙ',  lv: '★',   speeds: [0.9, 0.85, 0.8, 0.76, 0.72], lead: 0.8,  lagMul: 1.15, lagCap: 0.92,
            cf: 0.2,  assist: 0.35, off: MAX / 3,   offDecel: -MAX / 2.2, bump: 0.75 },
  medium: { name: 'СРЕДНИЙ', lv: '★★',  speeds: [0.98, 0.95, 0.91, 0.87, 0.83], lead: 0.93, lagMul: 1.1, lagCap: 0.98,
            cf: 0.27, assist: 0.15, off: MAX / 3.5, offDecel: -MAX / 1.8, bump: 0.6 },
  hard:   { name: 'ТЯЖЁЛЫЙ', lv: '★★★', speeds: [1.03, 1.0, 0.97, 0.94, 0.9], lead: 1,    lagMul: 1.06, lagCap: 1.05,
            cf: 0.33, assist: 0,    off: MAX / 4,   offDecel: -MAX / 1.5, bump: 0.5 },
};
let diffKey = 'easy';
try { const d = localStorage.getItem('turbo-diff'); if (DIFFS[d]) diffKey = d; } catch (_) {}
let diff = DIFFS[diffKey];
const CAR_W = 0.3;                  // car width in road half-width units
const START_SEG = 22;

// ================= sprites (drawn once into offscreen canvases) =================
function mk(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round';
  fn(g, w, h); return c;
}
function rr(g, x, y, w, h, r) {

// ================= track =================
let segments = [], N = 0, trackLength = 0, FINISH_Z = 0;
const lastY = () => segments.length ? segments[segments.length - 1].p2.world.y : 0;
function addSegment(curve, y) {
  const n = segments.length;
  segments.push({ index: n, curve, sprites: [], cars: [], clip: 0, looped: false,
    p1: { world: { y: lastY(), z: n * SEG }, camera: {}, screen: {} },
    p2: { world: { y, z: (n + 1) * SEG }, camera: {}, screen: {} } });
}
function addRoad(enter, hold, leave, curve, height) {
  const sy = lastY(), ey = sy + height * SEG, total = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(sy, ey, n / total));
  for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(sy, ey, (enter + n) / total));
  for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(sy, ey, (enter + hold + n) / total));
}
const zoneOf = i => i < N * 0.36 ? 0 : i < N * 0.7 ? 1 : 2;

function buildTrack() {
  segments = [];
  const R = addRoad;
  R(25, 100, 25, 0, 0);
  R(50, 50, 50, -2, 10);
  R(40, 80, 40, 0, 25);
  R(50, 60, 50, 3, -15);
  R(30, 40, 30, -3, 0);
  R(30, 40, 30, 3, 0);
  R(60, 60, 60, 0, -20);
  R(50, 80, 50, -4, 30);
  R(40, 100, 40, 2, -20);
  R(30, 30, 30, 0, 20);
  R(30, 30, 30, 0, -20);
  R(50, 50, 50, -3, 0);
  R(50, 100, 50, 0, 0);
  R(40, 40, 40, 4, 25);
  R(40, 40, 40, -4, -25);
  R(50, 80, 50, 2, 40);
  R(50, 60, 50, -2, -30);
  R(30, 30, 30, 3, 0);
  R(40, 80, 40, -3, 0);
  R(50, 100, 50, 0, -lastY() / SEG);
  N = segments.length; trackLength = N * SEG;
  FINISH_Z = trackLength + START_SEG * SEG;

  segments.forEach((s, i) => {
    const z = ZONES[zoneOf(i)], d = Math.floor(i / RUMBLE) % 2;
    s.zone = zoneOf(i);
    s.c = { grass: z.grassR[d], road: z.roadR[d], rumble: z.rumbleR[d], lane: d === 0 ? z.laneR : null };
    s.cs = { grass: rgbStr(s.c.grass), road: rgbStr(s.c.road), rumble: rgbStr(s.c.rumble), lane: s.c.lane && rgbStr(s.c.lane) };
    s.finish = i === START_SEG || i === START_SEG + 1;
  });

  const add = (i, spr, offset, type = 'deco') => segments[wrap(i, N)].sprites.push({ spr, offset, type });
  add(START_SEG, S.arch, 0, 'arch');
  for (let i = 4; i < 60; i += 4) { add(i, S.flags[(i / 4) % 4], -1.3); add(i + 2, S.flags[(i / 4 + 2) % 4], 1.3); }
  for (let i = 60; i < N - 10; i++) {
    const deco = S.deco[segments[i].zone];
    if (i % 5 === 0) add(i, deco[(Math.random() * deco.length) | 0], -rand(1.45, 3.2));
    if (i % 5 === 2) add(i, deco[(Math.random() * deco.length) | 0], rand(1.45, 3.2));
    if (i % 13 === 0 && Math.random() < 0.6) add(i, deco[(Math.random() * deco.length) | 0], (Math.random() < 0.5 ? -1 : 1) * rand(3.5, 6));
  }
  for (let i = 40; i < N - 20; i++) {
    const c = segments[i].curve;
    if (Math.abs(c) > 1.5 && i % 9 === 0) add(i, c > 0 ? S.chevR : S.chevL, c > 0 ? -1.22 : 1.22, 'sign');
  }
  for (let i = 50; i < N - 30; i += rand(55, 85) | 0) {
    const lane = [-0.66, 0, 0.66][(Math.random() * 3) | 0];
    const drift = Math.random() < 0.4 ? (Math.random() < 0.5 ? -0.33 : 0.33) : 0;
    for (let k = 0; k < 5; k++) add(i + k * 4, S.star, clamp(lane + drift * (k - 2) / 2, -0.8, 0.8), 'star');
  }
}

let hasTilt = false, tiltRaw = 0, tiltZero = 0;
function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;
  hasTilt = true;
  const b = e.beta * Math.PI / 180, gm = e.gamma * Math.PI / 180;
  const gx = Math.sin(gm) * Math.cos(b), gy = -Math.sin(b);   // gravity in device coords
  let a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  a = a * Math.PI / 180;
  const sx = gx * Math.cos(a) - gy * Math.sin(a);            // gravity along screen's right axis
  tiltRaw = Math.asin(clamp(sx, -1, 1)) * 180 / Math.PI;
}
window.addEventListener('deviceorientation', onOrient);

function getSteer() {
  if (input.left || input.right) return (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (input.touch !== null) return input.touch;
  if (hasTilt) {
    const d = tiltRaw - tiltZero, s = Math.sign(d);
    return s * Math.min(1, Math.pow(Math.max(0, Math.abs(d) - 2.5) / 17, 1.2));
  }
  return 0;
}

const Snd = {
  ac: null, master: null, muted: false,
  init() {

      this.engF = ac.createBiquadFilter(); this.engF.type = 'lowpass'; this.engF.frequency.value = 500;
      this.engG = ac.createGain(); this.engG.gain.value = 0;

      this.eng2 = ac.createOscillator(); this.eng2.type = 'square'; this.eng2.frequency.value = 25;
      const g2 = ac.createGain(); g2.gain.value = 0.4;
      this.eng.connect(this.engF); this.eng2.connect(g2); g2.connect(this.engF);
      this.engF.connect(this.engG); this.engG.connect(this.master);

  engine(sp, on) {

    this.eng2.frequency.setTargetAtTime(24 + sp * 60, t, 0.06);
    this.engF.frequency.setTargetAtTime(350 + sp * 1100, t, 0.1);
    this.engG.gain.setTargetAtTime(on ? 0.045 + sp * 0.05 : 0, t, 0.15);
  },
  tone(f, d, type = 'square', v = 0.14, delay = 0, f2) {

  star() { this.tone(988, 0.08, 'square', 0.1); this.tone(1480, 0.14, 'square', 0.1, 0.07); },
  bump() { this.tone(140, 0.22, 'triangle', 0.4, 0, 50); this.noise(0.18, 0.3, 500); },

// ================= particles =================
function burst(x, y, n, colors, kind = 'dot', spread = 1) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), v = rand(80, 320) * spread;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, life: 0, max: rand(0.5, 1.1), c: colors[(Math.random() * colors.length) | 0],
      s: rand(4, 9), kind, rot: rand(0, 6), vr: rand(-8, 8), g: 500 });
  }
}
function confetti() {
  const cols = ['#ff3b4e', '#ffd23f', '#2ee05a', '#2f6bff', '#a855f7', '#00e5ff', '#ff7a1a'];
  for (let i = 0; i < 160; i++) particles.push({ x: rand(0, W), y: rand(-H * 0.6, -10), vx: rand(-40, 40), vy: rand(60, 200), life: 0, max: rand(3, 5),
    c: cols[i % cols.length], s: rand(7, 13), kind: 'conf', rot: rand(0, 6), vr: rand(-6, 6), g: 60 });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life += dt;
    if (p.life > p.max) { particles.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.kind === 'conf') p.vx += Math.sin(p.life * 4 + p.rot) * 30 * dt;
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = p.kind === 'conf' ? 1 : 1 - p.life / p.max;
    ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = p.c;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.kind === 'star') { starPath(ctx, 0, 0, p.s * 1.6, p.s * 0.7); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke(); }
    else if (p.kind === 'conf') ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    else { ctx.beginPath(); ctx.arc(0, 0, p.s, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ================= update =================
const findSeg = z => segments[Math.floor(z / SEG) % N];

function updateCars(dt) {
  for (const car of cars) {
    const oldSeg = findSeg(car.z);
    let target = 0;
    if (state === 'menu') target = MAX * 0.33;
    else if (state === 'race' || state === 'finish') {
      target = car.base;
      const gap = car.total - player.total;
      if (!car.finished && !player.finished) {
        if (gap > 30 * SEG) target *= diff.lead;
        else if (gap < -40 * SEG) target = Math.min(target * diff.lagMul, MAX * diff.lagCap);
      }
      const behind = player.total - car.total;
      if (behind > 0 && behind < 2.5 * SEG && overlap(playerX, CAR_W, car.offset, CAR_W, 1.3)) {
        target = Math.min(target, speed * 0.9);
        car.lane = clamp(car.lane + (car.offset >= playerX ? 1 : -1) * dt * 0.9, -0.8, 0.8);
      }
    }
    car.speed = car.speed < target ? Math.min(target, car.speed + ACCEL * 0.75 * dt) : Math.max(target, car.speed - MAX * 0.6 * dt);
    car.phase += dt * 0.45;
    const desired = car.lane + Math.sin(car.phase) * 0.22;
    car.offset += (desired - car.offset) * Math.min(1, dt * 1.2);
    car.spin = Math.max(0, car.spin - dt * 1.4);
    car.z = wrap(car.z + dt * car.speed, trackLength);
    car.total += dt * car.speed;
    if (!car.finished && state !== 'menu' && car.total >= FINISH_Z) { car.finished = true; car.order = ++finishCount; }
    const newSeg = findSeg(car.z);
    if (oldSeg !== newSeg) { const k = oldSeg.cars.indexOf(car); if (k >= 0) oldSeg.cars.splice(k, 1); newSeg.cars.push(car); }
  }
}

function update(dt) {
  T += dt;
  const pSeg = findSeg(position + PLAYER_Z);
  const sp = speed / MAX;

  if (state === 'menu') {
    speed = MAX * 0.33;
    playerX = Math.sin(T * 0.25) * 0.35;
    steerSm = Math.cos(T * 0.25) * 0.2;
  } else {
    if (state === 'countdown') {
      const prev = countT; countT -= dt;
      const n = Math.ceil(countT);
      if (n !== countShown && n > 0) { countShown = n; showCount(String(n)); Snd.count(false); }
      if (countT <= 0 && prev > 0) {
        state = 'race'; showCount('ВПЕРЁД!', true); Snd.count(true);
        tiltZero = clamp(tiltRaw, -12, 12);
        setTimeout(() => { if (!hasTilt && isTouch && state === 'race') { $('hint').hidden = false; setTimeout(() => { $('hint').hidden = true; }, 4500); } }, 900);
      }
    }
    const target = state === 'finish' ? clamp(-playerX * 1.5, -1, 1) : (state === 'race' ? getSteer() : 0);
    steerSm += (target - steerSm) * Math.min(1, dt * (hasTilt ? 12 : 9));

    if (state === 'race' || state === 'finish') {
      const dx = dt * 2.2 * Math.min(sp, 1.1);
      playerX += steerSm * dx;
      playerX -= dx * Math.min(sp, 1) * pSeg.curve * diff.cf;
      if (Math.abs(playerX) > 0.95 && Math.abs(steerSm) < 0.25) playerX -= Math.sign(playerX) * dt * diff.assist * Math.min(1, sp + 0.2);
      playerX = clamp(playerX, -2.4, 2.4);

      const gas = state === 'race' && (input.gas || input.kGas);
      braking = state === 'race' ? (input.brake || input.kBrake) : speed > MAX * 0.25;
      if (nitroT > 0) speed = Math.min(NITRO_MAX, speed + ACCEL * 2.2 * dt);
      else if (braking) speed = Math.max(0, speed + BRAKE * dt);
      else if (gas) speed = speed < MAX ? Math.min(MAX, speed + ACCEL * dt) : Math.max(MAX, speed - MAX * 0.4 * dt);
      else speed = Math.max(0, speed + DECEL * dt * (speed > MAX ? 2.5 : 1));
      offroad = Math.abs(playerX) > 1.05;
      if (offroad && speed > diff.off) speed = Math.max(diff.off, speed + diff.offDecel * dt);
      if (offroad && speed > MAX * 0.15 && Math.random() < 0.5) {
        const cols = ZONES[pSeg.zone].grass;
        burst(W / 2 + rand(-1, 1) * W * 0.12, H - H * 0.04, 1, cols, 'dot', 0.6);
      }
    }
  }

  position = wrap(position + dt * speed, trackLength);
  if (state !== 'menu') player.total += dt * speed;

  // collisions with opponents
  if (state === 'race') {
    for (const car of pSeg.cars) {
      if (speed > car.speed && overlap(playerX, CAR_W, car.offset, CAR_W, 0.85)) {
        if (nitroT > 0) {
          const side = car.offset >= playerX ? 1 : -1;
          car.lane = clamp(car.lane + side * 0.7, -0.85, 0.85); car.offset += side * 0.3;
          car.spin = 1; car.speed *= 0.5; shake = 7; Snd.bump(); toast('БАХ!', '#ffd23f');
        } else {
          speed = car.speed * diff.bump; playerX += playerX >= car.offset ? 0.12 : -0.12;
          car.spin = 0.5; shake = 6; Snd.bump();
        }
        break;
      }
    }
    // stars
    for (const s of [segments[wrap(pSeg.index - 1, N)], pSeg]) {
      for (let i = s.sprites.length - 1; i >= 0; i--) {
        const sp2 = s.sprites[i];
        if (sp2.type === 'star' && Math.abs(sp2.offset - playerX) < 0.32) {
          s.sprites.splice(i, 1); starsGot++; $('stars').textContent = starsGot; Snd.star();
          burst(W / 2 + (sp2.offset - playerX) * W * 0.3, H * 0.72, 7, ['#ffd23f', '#fff6a8', '#ff9f1c'], 'star');
        }
      }
    }
    // nitro button timing
    if (nitroT > 0) { nitroT -= dt; if (nitroT <= 0) nextNitro = rand(8, 13); }
    else if (nitroShown) { nitroLeft -= dt; if (nitroLeft <= 0) { nitroShown = false; $('nitro').hidden = true; nextNitro = rand(5, 9); } }
    else { nextNitro -= dt; if (nextNitro <= 0) { nitroShown = true; nitroLeft = 9; $('nitro').hidden = false; Snd.ready(); } }
    // zone change
    if (pSeg.zone !== zoneNow) { zoneNow = pSeg.zone; if (zoneNow > 0) toast(ZONES[zoneNow].name); }
    // finish line
    if (player.total >= FINISH_Z) {
      player.finished = true; player.order = ++finishCount; place = calcPlace();
      state = 'finish'; finishT = 0; nitroT = 0; nitroShown = false; $('nitro').hidden = true;
      Snd.win(); confetti(); toast(place === 1 ? 'ФИНИШ! 1!' : 'ФИНИШ!', '#ffd23f');
    }
  } else if (state === 'finish') {
    finishT += dt;
    if (finishT > 2 && $('finish').hidden) showFinish();
  }

  updateCars(dt);
  if (state === 'race') {
    place = calcPlace();
    if (place < lastPlace && T > 1) { toast('ОБГОН!', '#2ee05a'); Snd.pass(); }
    lastPlace = place;
  }
  updateParticles(dt);
  shake = Math.max(0, shake - dt * 20);
  bgOffset += pSeg.curve * dt * speed / SEG * 0.0025;

  const tz = ZONES[pSeg.zone].bg, k = Math.min(1, dt * 1.2);
  for (const key of ['skyTop', 'skyBot', 'far', 'near']) bg[key] = mixRgb(bg[key], tz[key], k);
  bg.peak = lerp(bg.peak, tz.peak, k);

  Snd.engine(Math.min(speed / MAX, 1.4) + (state === 'countdown' && (input.gas || input.kGas) ? 0.5 : 0),
    state === 'countdown' || state === 'race' || (state === 'finish' && $('finish').hidden));
  if (state !== 'menu') updateHud();
}

// ================= render =================
function project(p, camX, camY, camZ) {
  p.camera.x = (p.world.x || 0) - camX;
  p.camera.y = (p.world.y || 0) - camY;
  p.camera.z = (p.world.z || 0) - camZ;
  p.screen.scale = CAM_D / p.camera.z;
  p.screen.x = W / 2 + p.screen.scale * p.camera.x * W / 2;
  p.screen.y = H / 2 - p.screen.scale * p.camera.y * H / 2;
  p.screen.w = p.screen.scale * ROAD_W * W / 2;
}
function poly(x1, y1, x2, y2, x3, y3, x4, y4, c) {
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4); ctx.closePath(); ctx.fill();
}
function renderSegment(seg, fog) {
  const x1 = seg.p1.screen.x, y1 = seg.p1.screen.y, w1 = seg.p1.screen.w;
  const x2 = seg.p2.screen.x, y2 = seg.p2.screen.y, w2 = seg.p2.screen.w;
  let cs = seg.cs;
  if (fog > 0) {
    const f = bg.skyBot;
    cs = { grass: rgbStr(mixRgb(seg.c.grass, f, fog)), road: rgbStr(mixRgb(seg.c.road, f, fog)), rumble: rgbStr(mixRgb(seg.c.rumble, f, fog)),
      lane: seg.c.lane && rgbStr(mixRgb(seg.c.lane, f, fog)) };
  }
  ctx.fillStyle = cs.grass; ctx.fillRect(0, y2, W, y1 - y2 + 1);
  const r1 = w1 / 7, r2 = w2 / 7;
  poly(x1 - w1 - r1, y1 + 0.5, x1 - w1, y1 + 0.5, x2 - w2, y2, x2 - w2 - r2, y2, cs.rumble);
  poly(x1 + w1 + r1, y1 + 0.5, x1 + w1, y1 + 0.5, x2 + w2, y2, x2 + w2 + r2, y2, cs.rumble);
  poly(x1 - w1, y1 + 0.5, x1 + w1, y1 + 0.5, x2 + w2, y2, x2 - w2, y2, cs.road);
  if (seg.finish) {
    const n = 10;
    for (let k = 0; k < n; k++) {
      if ((k + seg.index) % 2) continue;
      const a1 = x1 - w1 + 2 * w1 * k / n, b1 = x1 - w1 + 2 * w1 * (k + 1) / n;
      const a2 = x2 - w2 + 2 * w2 * k / n, b2 = x2 - w2 + 2 * w2 * (k + 1) / n;
      poly(a1, y1 + 0.5, b1, y1 + 0.5, b2, y2, a2, y2, '#111');
    }
    for (let k = 0; k < n; k++) {
      if ((k + seg.index) % 2 === 0) continue;
      const a1 = x1 - w1 + 2 * w1 * k / n, b1 = x1 - w1 + 2 * w1 * (k + 1) / n;
      const a2 = x2 - w2 + 2 * w2 * k / n, b2 = x2 - w2 + 2 * w2 * (k + 1) / n;
      poly(a1, y1 + 0.5, b1, y1 + 0.5, b2, y2, a2, y2, '#fff');
    }
  } else if (cs.lane) {
    const l1 = w1 / 28, l2 = w2 / 28;
    let lx1 = x1 - w1 + 2 * w1 / LANES, lx2 = x2 - w2 + 2 * w2 / LANES;
    for (let lane = 1; lane < LANES; lane++) {
      poly(lx1 - l1 / 2, y1 + 0.5, lx1 + l1 / 2, y1 + 0.5, lx2 + l2 / 2, y2, lx2 - l2 / 2, y2, cs.lane);
      lx1 += 2 * w1 / LANES; lx2 += 2 * w2 / LANES;
    }
  }
}
function drawSprite(spr, scale, x, y, offX, clipY, alpha, rot) {
  const dw = spr.ww * scale * W / 2, dh = dw * spr.ar;
  if (dw < 1.5 || dw > W * 9) return;
  const dx = x + dw * offX, dy = y - dh;
  const clipH = clipY ? Math.max(0, dy + dh - clipY) : 0;
  if (clipH >= dh) return;
  ctx.globalAlpha = alpha;
  if (rot) {
    ctx.save(); ctx.translate(dx + dw / 2, dy + dh * 0.7); ctx.rotate(rot);
    ctx.drawImage(spr.img, -dw / 2, -dh * 0.7, dw, dh); ctx.restore();
  } else if (clipH > 0) {
    const ih = spr.img.height * (1 - clipH / dh);
    if (ih >= 1) ctx.drawImage(spr.img, 0, 0, spr.img.width, ih, dx, dy, dw, dh - clipH);
  } else ctx.drawImage(spr.img, dx, dy, dw, dh);
  ctx.globalAlpha = 1;
}

function hillY(u, layer, peak) {
  const a = Math.sin(u * 0.0045 + layer * 1.7) * 0.5 + 0.5;
  const b = Math.sin(u * 0.0113 + layer * 3.1) * 0.5 + 0.5;
  const round = a * 0.7 + b * 0.3;
  const p = 1 - Math.abs(Math.sin(u * 0.0062 + layer));
  return lerp(round, p * 0.78 + b * 0.22, peak);
}
function drawBackground() {
  const hz = H * 0.5;
  const g = ctx.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, rgbStr(bg.skyTop)); g.addColorStop(1, rgbStr(bg.skyBot));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz + 2);
  // sun
  const sx = W * 0.8, sy = H * 0.15, sr = Math.min(W, H) * 0.075;
  const sg = ctx.createRadialGradient(sx, sy, sr * 0.5, sx, sy, sr * 2.6);
  sg.addColorStop(0, 'rgba(255,240,150,.9)'); sg.addColorStop(1, 'rgba(255,240,150,0)');
  ctx.fillStyle = sg; ctx.fillRect(sx - sr * 3, sy - sr * 3, sr * 6, sr * 6);
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(T * 0.15); ctx.fillStyle = '#ffe36b';
  for (let i = 0; i < 10; i++) { ctx.rotate(Math.PI / 5); ctx.beginPath(); ctx.moveTo(sr * 1.15, -sr * 0.18); ctx.lineTo(sr * 1.6, 0); ctx.lineTo(sr * 1.15, sr * 0.18); ctx.fill(); }
  ctx.restore();
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#ff9f1c'; ctx.stroke();
  // clouds
  for (const c of clouds) {
    const cw = Math.min(W, H) * 0.42 * c.s, ch = cw * 0.47;
    const span = W + cw * 2;
    const x = wrap(c.x * span - bgOffset * W * 0.5 - T * c.v * W, span) - cw;
    ctx.drawImage(S.cloud, x, H * c.y, cw, ch);
  }
  // hills
  const layer = (col, amp, base, off, id) => {
    ctx.fillStyle = rgbStr(col); ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 12; x += 12) ctx.lineTo(x, base - amp * hillY((x + off) / W * 900, id, bg.peak));
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  };
  layer(bg.far, H * 0.17, hz + 2, bgOffset * W * 0.8, 1);
  if (bg.peak > 0.5) { // snowy tops on far mountains
    ctx.save(); ctx.globalAlpha = (bg.peak - 0.5) * 1.6; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(0, 0);
    for (let x = 0; x <= W + 12; x += 12) ctx.lineTo(x, hz + 2 - H * 0.17 * hillY((x + bgOffset * W * 0.8) / W * 900, 1, bg.peak));
    ctx.lineTo(W, 0); ctx.closePath(); ctx.clip();
    ctx.fillRect(0, hz - H * 0.17, W, H * 0.06); ctx.restore();
  }
  layer(bg.near, H * 0.09, hz + 4, bgOffset * W * 1.5, 2);
}

function drawPlayer() {
  const sc = CAM_D / PLAYER_Z;
  const spr = S.player, dw = spr.ww * sc * W / 2, dh = dw * spr.ar;
  let bounce = 0;
  if (speed > 0) bounce = offroad ? rand(-1, 1) * dh * 0.035 : Math.sin(T * 26) * dh * 0.008 * Math.min(1, speed / MAX);
  const cx = W / 2 + steerSm * dw * 0.05, by = H - Math.max(6, H * 0.015) + bounce;
  ctx.save(); ctx.translate(cx, by); ctx.rotate(steerSm * 0.05);
  if (nitroT > 0) {
    ctx.globalCompositeOperation = 'lighter';
    for (const px of [-60 / 320, 60 / 320]) {
      const fx = px * dw, fy = -22 / 200 * dh, fr = dw * rand(0.07, 0.11);
      const fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr * 2);
      fg.addColorStop(0, 'rgba(255,255,255,1)'); fg.addColorStop(0.3, 'rgba(0,229,255,.9)'); fg.addColorStop(0.6, 'rgba(255,120,30,.6)'); fg.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(fx, fy, fr * 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.drawImage(spr.img, -dw / 2, -dh, dw, dh);
  if (braking && speed > 0) {
    ctx.globalCompositeOperation = 'lighter';
    for (const px of [-104 / 320, 104 / 320]) {
      const lx = px * dw, ly = -(1 - 119 / 200) * dh, lr = dw * 0.14;
      const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, lr);
      lg.addColorStop(0, 'rgba(255,120,120,.95)'); lg.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lx, ly, lr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
}

function drawFx() {
  if (bg.peak > 0.55) {
    ctx.fillStyle = '#ffffff'; ctx.globalAlpha = clamp((bg.peak - 0.55) / 0.45, 0, 1) * 0.9;
    for (const f of flakes) {
      f.y += f.v * (1 / 60) * (1 + speed / MAX); f.w += 0.02;
      if (f.y > 1) { f.y = 0; f.x = Math.random(); }
      const x = wrap(f.x * W + Math.sin(f.w) * 12 - bgOffset * W * 2, W);
      ctx.beginPath(); ctx.arc(x, f.y * H, f.s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  if (nitroT > 0 || speed > MAX * 1.02) {
    const k = clamp((speed - MAX * 0.95) / (NITRO_MAX - MAX * 0.95), 0.2, 1);
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3;
    const cx = W / 2, cy = H * 0.48, R = Math.hypot(W, H) / 2;
    for (let i = 0; i < 22 * k; i++) {
      const a = rand(0, Math.PI * 2), r1 = rand(0.45, 0.8) * R, r2 = r1 + rand(60, 180) * k;
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2); ctx.stroke();
    }
    const vg = ctx.createRadialGradient(cx, cy, R * 0.55, cx, cy, R);
    vg.addColorStop(0, 'rgba(139,61,255,0)'); vg.addColorStop(1, `rgba(139,61,255,${0.35 * k})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
}

function render() {
  const baseSeg = findSeg(position);
  const basePct = pctRem(position, SEG);
  const pSeg = findSeg(position + PLAYER_Z);
  const pPct = pctRem(position + PLAYER_Z, SEG);
  const playerY = lerp(pSeg.p1.world.y, pSeg.p2.world.y, pPct);
  let maxy = H, x = 0, dx = -(baseSeg.curve * basePct);

  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * shake, rand(-1, 1) * shake);
  drawBackground();

  for (let n = 0; n < DRAW; n++) {
    const seg = segments[(baseSeg.index + n) % N];
    seg.looped = seg.index < baseSeg.index;
    seg.clip = maxy;
    const camZ = position - (seg.looped ? trackLength : 0);
    project(seg.p1, playerX * ROAD_W - x, playerY + CAM_H, camZ);
    project(seg.p2, playerX * ROAD_W - x - dx, playerY + CAM_H, camZ);
    x += dx; dx += seg.curve;
    seg.fog = Math.pow(clamp((n - DRAW * 0.5) / (DRAW * 0.5), 0, 1), 1.6) * 0.75;
    if (seg.p1.camera.z <= CAM_D || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;
    renderSegment(seg, seg.fog);
    maxy = seg.p1.screen.y;
  }

  for (let n = DRAW - 1; n > 0; n--) {
    const seg = segments[(baseSeg.index + n) % N];
    const alpha = 1 - seg.fog * 0.8;
    for (const sp of seg.sprites) {
      const sc = seg.p1.screen.scale;
      const sx = seg.p1.screen.x + sc * sp.offset * ROAD_W * W / 2;
      const offX = sp.type === 'star' || sp.type === 'arch' ? -0.5 : (sp.offset < 0 ? -1 : 0);
      const bob = sp.type === 'star' ? Math.sin(T * 5 + seg.index) * sc * 60 * H / 2 : 0;
      drawSprite(sp.spr, sc, sx, seg.p1.screen.y - bob, offX, seg.clip, alpha);
    }
    for (const car of seg.cars) {
      const cp = pctRem(car.z, SEG);
      const sc = lerp(seg.p1.screen.scale, seg.p2.screen.scale, cp);
      const sx = lerp(seg.p1.screen.x, seg.p2.screen.x, cp) + sc * car.offset * ROAD_W * W / 2;
      const sy = lerp(seg.p1.screen.y, seg.p2.screen.y, cp);
      const rot = car.spin > 0 ? Math.sin(car.spin * 18) * 0.35 * car.spin : 0;
      drawSprite(car.spr, sc, sx, sy, -0.5, seg.clip, alpha, rot);
    }
    if (seg === pSeg) drawPlayer();
  }
  drawFx();
  ctx.restore();
  drawParticles();
}

// ================= loop =================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}

buildSprites();
buildTrack();
resetCars();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
